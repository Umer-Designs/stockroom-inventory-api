services:
  - type: web
    name: umer-stockroom-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        sync: false
      - key: INVENTORY_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://umer-designs.github.io
